# Auth Module - Standalone Development (DEPRECATED)
# 
# ⚠️  IMPORTANT: This file is deprecated in favor of the unified infrastructure approach.
# 
# For development, use the consolidated infrastructure instead:
#   cd ../infrastructure
#   make dev-full-stack
#
# This will start all infrastructure services + auth service + django core + frontend
# 
# If you need to run ONLY the auth service for testing:
#   docker-compose -f docker-compose.standalone.yml up
#
version: '3.8'

services:
  # Auth Service Only (connects to external infrastructure)
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: erp-auth-service-standalone
    ports:
      - "8080:8080"  # HTTP API
      - "50051:50051"  # gRPC (updated port)
    environment:
      # Database (connects to infrastructure postgres)
      DB_HOST: host.docker.internal
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: erp_auth
      DB_SSL_MODE: disable
      
      # Redis (connects to infrastructure redis)
      REDIS_HOST: host.docker.internal
      REDIS_PORT: 6379
      REDIS_PASSWORD: redispassword
      REDIS_DB: 0
      
      # JWT
      JWT_SECRET: dev-super-secret-jwt-key-change-in-production
      JWT_ACCESS_EXPIRY: 3600
      JWT_REFRESH_EXPIRY: 604800
      
      # Server
      HTTP_PORT: 8080
      GRPC_PORT: 50051
      GIN_MODE: debug
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      
      # Kafka (connects to infrastructure kafka)
      KAFKA_BROKERS: host.docker.internal:9092
      KAFKA_TOPIC: auth-events
      KAFKA_GROUP_ID: auth-service-group
      
      # Environment
      ENV: development
      LOG_LEVEL: debug
    volumes:
      - .:/app
      - go_mod_cache:/go/pkg/mod
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  go_mod_cache:

# Note: This service connects to the shared infrastructure services
# Make sure to start the infrastructure first:
#   cd ../infrastructure && make dev-up