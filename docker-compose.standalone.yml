# Standalone Auth Service Development
# 
# ⚠️  This is for testing the auth service in isolation only.
# For full development, use: cd ../infrastructure && make dev-full-stack
#
# Prerequisites: Infrastructure services must be running
#   cd ../infrastructure && make dev-up
#
version: '3.8'

services:
  # Auth Service Only (connects to shared infrastructure)
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: erp-auth-service-standalone
    ports:
      - "8080:8080"   # HTTP API
      - "50051:50051" # gRPC API
    environment:
      # Database (connects to infrastructure postgres)
      DB_HOST: host.docker.internal
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: erp_auth
      DB_SSL_MODE: disable
      
      # Redis (connects to infrastructure redis)
      REDIS_HOST: host.docker.internal
      REDIS_PORT: 6379
      REDIS_PASSWORD: redispassword
      REDIS_DB: 0
      
      # JWT Configuration
      JWT_SECRET: dev-super-secret-jwt-key-change-in-production
      JWT_ACCESS_EXPIRY: 3600
      JWT_REFRESH_EXPIRY: 604800
      
      # Server Configuration
      HTTP_PORT: 8080
      GRPC_PORT: 50051
      GIN_MODE: debug
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      
      # Kafka (connects to infrastructure kafka)
      KAFKA_BROKERS: host.docker.internal:9092
      KAFKA_TOPIC: auth-events
      KAFKA_GROUP_ID: auth-service-group
      
      # Environment
      ENV: development
      LOG_LEVEL: debug
    volumes:
      - .:/app
      - go_mod_cache:/go/pkg/mod
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  go_mod_cache:

# Usage:
# 1. Start infrastructure: cd ../infrastructure && make dev-up
# 2. Run standalone auth: docker-compose -f docker-compose.standalone.yml up --build