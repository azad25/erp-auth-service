version: '3.8'

# ============================================================================
# ERP Auth Service - Standalone Docker Compose for Independent Testing
# ============================================================================
# This file provides a complete testing environment for the auth service
# with all required dependencies (PostgreSQL, Redis, Kafka) isolated
# from the main infrastructure stack.
#
# Usage:
#   docker-compose -f docker-compose.standalone.yml up -d
#   docker-compose -f docker-compose.standalone.yml down -v
# ============================================================================

services:
  # ============================================================================
  # CORE DEPENDENCIES
  # ============================================================================

  # PostgreSQL - Primary database for auth service
  postgres-auth:
    image: postgres:15-alpine
    container_name: auth-service-postgres
    environment:
      POSTGRES_DB: erp_auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5433:5432"  # Different port to avoid conflicts
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d erp_auth"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'
    networks:
      - auth-network
    restart: unless-stopped

  # Redis - Cache and session storage
  redis-auth:
    image: redis:7-alpine
    container_name: auth-service-redis
    command: redis-server --appendonly yes --requirepass redispassword --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "6380:6379"  # Different port to avoid conflicts
    volumes:
      - redis_auth_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "redispassword", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
        reservations:
          memory: 64M
          cpus: '0.1'
    networks:
      - auth-network
    restart: unless-stopped

  # Kafka - Event streaming (KRaft mode for simplicity)
  kafka-auth:
    image: confluentinc/cp-kafka:7.4.0
    container_name: auth-service-kafka
    environment:
      # KRaft Configuration (no Zookeeper needed)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-auth:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9093,CONTROLLER://0.0.0.0:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-auth:29092,PLAINTEXT_HOST://localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      
      # Topic Configuration (optimized for testing)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      
      # Log Configuration (minimal for testing)
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 1
      KAFKA_LOG_SEGMENT_BYTES: 67108864
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      
      # Performance Configuration (lightweight for testing)
      KAFKA_NUM_NETWORK_THREADS: 2
      KAFKA_NUM_IO_THREADS: 2
      KAFKA_SOCKET_SEND_BUFFER_BYTES: 32768
      KAFKA_SOCKET_RECEIVE_BUFFER_BYTES: 32768
      KAFKA_SOCKET_REQUEST_MAX_BYTES: 26214400
      
      # Memory optimization for testing
      KAFKA_HEAP_OPTS: "-Xmx128m -Xms128m"
      
      # Cluster Configuration
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    ports:
      - "9093:9093"  # External access port
    volumes:
      - kafka_auth_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 | grep -q 'ApiVersion' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'
    networks:
      - auth-network
    restart: unless-stopped

  # ============================================================================
  # AUTH SERVICE
  # ============================================================================

  # Auth Service - Main application
  auth-service:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: auth-service-app
    command: /go/bin/air -c .air.toml
    environment:
      # Database Configuration
      DB_HOST: postgres-auth
      DB_PORT: 5432
      DB_NAME: erp_auth
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_SSL_MODE: disable
      
      # Redis Configuration
      REDIS_HOST: redis-auth
      REDIS_PORT: 6379
      REDIS_PASSWORD: redispassword
      REDIS_DB: 0
      
      # Kafka Configuration
      KAFKA_BROKERS: kafka-auth:29092
      KAFKA_TOPIC: auth-events
      KAFKA_GROUP_ID: auth-service-group
      
      # JWT Configuration
      JWT_SECRET: test-jwt-secret-key-for-standalone-testing
      JWT_ACCESS_EXPIRY: 3600
      JWT_REFRESH_EXPIRY: 604800
      
      # Server Configuration
      HTTP_PORT: 8080
      GRPC_PORT: 50051
      GIN_MODE: debug
      
      # CORS Configuration
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080
      
      # Environment
      ENV: development
      LOG_LEVEL: debug
      
      # Testing specific
      ENABLE_SWAGGER: true
      ENABLE_METRICS: true
      ENABLE_PROFILING: true
    ports:
      - "8080:8080"   # HTTP API
      - "50051:50051" # gRPC API
      - "6060:6060"   # Profiling endpoint (pprof)
    volumes:
      - .:/app
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/go/cache
    depends_on:
      postgres-auth:
        condition: service_healthy
      redis-auth:
        condition: service_healthy
      kafka-auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'
    networks:
      - auth-network
    restart: unless-stopped

  # ============================================================================
  # TESTING & DEVELOPMENT TOOLS
  # ============================================================================

  # pgAdmin - PostgreSQL management UI
  pgadmin-auth:
    image: dpage/pgadmin4:8.0
    container_name: auth-service-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@auth.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: 'False'
      PGADMIN_CONFIG_WTF_CSRF_ENABLED: 'False'
    ports:
      - "8081:80"
    volumes:
      - pgadmin_auth_data:/var/lib/pgadmin
      - ./config/pgadmin-servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres-auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/misc/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - auth-network
    profiles:
      - tools
    restart: unless-stopped

  # Redis Commander - Redis management UI
  redis-commander-auth:
    image: rediscommander/redis-commander:latest
    container_name: auth-service-redis-commander
    environment:
      REDIS_HOSTS: local:redis-auth:6379:0:redispassword
      HTTP_USER: admin
      HTTP_PASSWORD: admin
    ports:
      - "8082:8081"
    depends_on:
      redis-auth:
        condition: service_healthy
    networks:
      - auth-network
    profiles:
      - tools
    restart: unless-stopped

  # Kafka UI - Kafka management and monitoring
  kafka-ui-auth:
    image: provectuslabs/kafka-ui:latest
    container_name: auth-service-kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: auth-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-auth:29092
      DYNAMIC_CONFIG_ENABLED: 'true'
      AUTH_TYPE: "LOGIN_FORM"
      SPRING_SECURITY_USER_NAME: admin
      SPRING_SECURITY_USER_PASSWORD: admin
    ports:
      - "8083:8080"
    depends_on:
      kafka-auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - auth-network
    profiles:
      - tools
    restart: unless-stopped

  # ============================================================================
  # TESTING UTILITIES
  # ============================================================================

  # Test Runner - For running integration and load tests
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: auth-service-test-runner
    command: tail -f /dev/null  # Keep container running for manual test execution
    environment:
      # Same environment as auth service for testing
      DB_HOST: postgres-auth
      DB_PORT: 5432
      DB_NAME: erp_auth
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_SSL_MODE: disable
      REDIS_HOST: redis-auth
      REDIS_PORT: 6379
      REDIS_PASSWORD: redispassword
      KAFKA_BROKERS: kafka-auth:29092
      AUTH_SERVICE_URL: http://auth-service:8080
      AUTH_SERVICE_GRPC: auth-service:50051
      TEST_ENV: standalone
    volumes:
      - .:/app
      - go_mod_cache:/go/pkg/mod
      - go_build_cache:/go/cache
    depends_on:
      auth-service:
        condition: service_healthy
    networks:
      - auth-network
    profiles:
      - testing
    restart: "no"

# ============================================================================
# VOLUMES
# ============================================================================
volumes:
  postgres_auth_data:
    driver: local
  redis_auth_data:
    driver: local
  kafka_auth_data:
    driver: local
  pgadmin_auth_data:
    driver: local
  go_mod_cache:
    driver: local
  go_build_cache:
    driver: local

# ============================================================================
# NETWORKS
# ============================================================================
networks:
  auth-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16